<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판 | 제주대학교 첨단인재양성 부트캠프</title>
<meta name="description" content="제주대학교 첨단인재양성 부트캠프 게시판">
<meta name="theme-color" content="#003288">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#003288;--navy-deep:#00265F;--sky:#0099E7;--green:#64A91C;--green-web:#54A323;--blue-web:#0E6FC1;
  --silver:#B0BCC2;--line:#DCE4EF;--bg:#fff;--bg-light:#F2F6FB;
  --t1:#222;--t2:#333;--t3:#666;--t4:#AFAFAF;--wrap:1120px;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);letter-spacing:-.02em;word-break:keep-all;color:var(--t2);background:var(--bg);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 16px;z-index:100}
.skip:focus{left:8px}
.strip{height:5px;background:linear-gradient(90deg,var(--green) 0 33.33%,var(--sky) 33.33% 66.66%,var(--navy) 66.66%)}
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.brand img{height:40px;width:auto;display:block}
.brand-div{width:1px;height:26px;background:var(--line)}
.brand b{font-size:16px;color:var(--navy);font-weight:800;line-height:1.25}
.gnb{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.gnb a{display:block;white-space:nowrap;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:600;font-size:16px;color:var(--t2)}
.gnb a:hover,.gnb a.on{color:var(--navy);background:var(--bg-light)}
.menu-btn{display:none;width:44px;height:44px;border:0;background:none;cursor:pointer;border-radius:8px}
.menu-btn span{display:block;width:22px;height:2px;background:var(--navy);margin:5px auto;border-radius:2px}

.page-head{background:var(--bg-light);border-bottom:1px solid var(--line);padding:48px 0 40px}
.page-head h1{margin:0;font-size:34px;font-weight:800;color:var(--navy);line-height:1.3}
.page-head p{margin:10px 0 0;color:var(--t3)}
.crumb{list-style:none;margin:0 0 14px;padding:0;display:flex;gap:8px;font-size:14px;color:var(--t3)}
.crumb a{color:var(--t3);text-decoration:none}
.crumb a:hover{color:var(--navy);text-decoration:underline}
.crumb li+li::before{content:"›";margin-right:8px;color:var(--t4)}

main{padding:40px 0 96px;min-height:50vh}
.board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:15px;color:var(--t3)}
.board-top strong{color:var(--navy)}
table.board{width:100%;border-collapse:collapse;border-top:2px solid var(--navy);font-size:16px}
table.board th{background:var(--bg-light);color:var(--t1);font-weight:700;padding:14px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.board td{padding:16px 12px;border-bottom:1px solid var(--line);text-align:center;color:var(--t3);white-space:nowrap}
table.board td.title{text-align:left;white-space:normal;color:var(--t1)}
table.board td.title a{color:var(--t1);text-decoration:none;font-weight:600}
table.board td.title a:hover{color:var(--navy);text-decoration:underline}
table.board tr:hover td{background:#FAFCFF}
.col-no{width:80px}.col-writer{width:140px}.col-date{width:140px}.col-view{width:90px}
.empty{padding:64px 0;text-align:center;color:var(--t4)}

.post{display:none}
.post.show{display:block}
.list.hide{display:none}
.post-head{border-top:2px solid var(--navy);border-bottom:1px solid var(--line);padding:22px 8px}
.post-head h2{margin:0 0 8px;font-size:24px;color:var(--t1);line-height:1.4}
.post-meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--t3)}
.post-meta b{color:var(--t2);font-weight:600;margin-right:4px}
.post-body{padding:32px 8px 40px;min-height:200px;border-bottom:1px solid var(--line);white-space:pre-line}
.post-nav{margin-top:24px;display:flex;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);transition:background .15s,color .15s}
.btn:hover{background:var(--bg-light)}

footer.site{background:#0F1E3D;color:rgba(255,255,255,.72);font-size:15px;padding:56px 0 96px}
footer.site a{color:inherit}
.ft{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
.ft img{height:44px;width:auto;display:block;margin-bottom:20px}
.ft p{margin:4px 0 0}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 20px}
.ft ul a{text-decoration:none}
.ft ul a:hover{color:#fff;text-decoration:underline}
.copy{margin-top:32px;font-size:13px;color:rgba(255,255,255,.45)}

@media (max-width:1023px){
  .gnb{display:none}
  .menu-btn{display:block}
  .gnb.open{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:77px;background:#fff;padding:12px 16px 20px;border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(0,50,136,.08)}
  .gnb.open a{padding:14px 12px;font-size:17px}
}
@media (max-width:640px){
  body{font-size:16px}
  .brand img{height:32px}.brand b{font-size:14px}
  .hd{height:64px}.gnb.open{top:69px}
  .page-head{padding:32px 0 28px}.page-head h1{font-size:26px}
  .col-writer,.col-view,td.writer,td.view{display:none}
  table.board td,table.board th{padding:12px 8px;font-size:15px}
}
</style>
</head>

<script>
const POSTS = [
  { id: 1, title: "테스트1", writer: "관리자", date: "2026-09-16", view: 0, body: "테스트1 게시글입니다." },
  { id: 2, title: "테스트2", writer: "관리자", date: "2026-09-16", view: 0, body: "테스트2 게시글입니다." },
];

const $ = (s, el = document) => el.querySelector(s);
$("#year").textContent = new Date().getFullYear();

const menuBtn = $("#menuBtn"), gnb = $("#gnb");
menuBtn.addEventListener("click", () => {
  const open = gnb.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open);
  menuBtn.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
});

function renderList() {
  const rows = $("#rows");
  rows.innerHTML = "";
  $("#total").textContent = POSTS.length;
  if (!POSTS.length) {
    rows.innerHTML = '<tr><td colspan="5" class="empty">등록된 게시글이 없습니다.</td></tr>';
    return;
  }
  [...POSTS].reverse().forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${POSTS.length - i}</td>` +
      `<td class="title"><a href="#post-${p.id}"></a></td>` +
      `<td class="writer">${p.writer}</td>` +
      `<td>${p.date}</td>` +
      `<td class="view">${p.view}</td>`;
    $("a", tr).textContent = p.title;
    rows.appendChild(tr);
  });
}

function route() {
  const m = location.hash.match(/^#post-(\d+)$/);
  const p = m && POSTS.find(x => x.id === Number(m[1]));
  if (p) {
    $("#postTitle").textContent = p.title;
    $("#postWriter").textContent = p.writer;
    $("#postDate").textContent = p.date;
    $("#postView").textContent = p.view;
    $("#postBody").textContent = p.body;
    $("#list").classList.add("hide");
    $("#post").classList.add("show");
    document.title = p.title + " | 게시판 | 제주대학교 첨단인재양성 부트캠프";
  } else {
    $("#list").classList.remove("hide");
    $("#post").classList.remove("show");
    document.title = "게시판 | 제주대학교 첨단인재양성 부트캠프";
  }
  window.scrollTo({ top: 0 });
}

renderList();
route();
window.addEventListener("hashchange", route);
</script>
